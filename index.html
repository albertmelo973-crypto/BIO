<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ANIMAL MERGE</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>

  <!-- Carátula -->
  <section class="caratula">
    <div>
      <h1>ANIMAL MERGE</h1>
      <button onclick="entrar()">Empezar</button>
    </div>
  </section>

  <!-- Sección de Animales -->
  <section id="animales" class="animales">
    <h2>Animales de Tingana</h2>
    <div class="animal-container">

      <div class="animal-card" onclick="mostrarInfo('mono-tocon')">
        <div class="card-content">
          <img src="https://i.postimg.cc/Y9g9yN0f/image.png" alt="Mono Tocón">
          <h3>Mono Tocón</h3>
        </div>
      </div>

      <div class="animal-card" onclick="mostrarInfo('ronsoco')">
        <div class="card-content">
          <img src="https://i.postimg.cc/rpg7Wj4Z/image.png" alt="Ronsoco">
          <h3>Ronsoco</h3>
        </div>
      </div>

      <div class="animal-card" onclick="mostrarInfo('martin-pescador')">
        <div class="card-content">
          <img src="https://i.postimg.cc/6pZvybkw/image.png" alt="Martín Pescador">
          <h3>Martín Pescador</h3>
        </div>
      </div>

      <div class="animal-card" onclick="mostrarInfo('mono-ardilla')">
        <div class="card-content">
          <img src="https://i.postimg.cc/DykWRPWM/image.png" alt="Mono Ardilla">
          <h3>Mono Ardilla</h3>
        </div>
      </div>

    </div>
  </section>

  <!-- Modal -->
  <div id="modal" class="modal">
    <div class="modal-content">
      <span class="close" onclick="cerrarModal()">&times;</span>
      <img id="modal-img" src="" alt="">
      <h3 id="modal-title"></h3>
      <p id="modal-desc"></p>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
