<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ANIMAL MERGE</title>
  <link rel="stylesheet" href="style.css">
  <!-- Fuente moderna -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>
  <!-- Pantalla de inicio -->
  <div id="caratula">
    <img src="https://i.postimg.cc/XvCpYszF/image-removebg-preview-4.png" alt="Tingana Logo" id="startBtn">
  </div>

  <!-- Pantalla principal con los animales -->
  <div id="main" class="hidden">
    <h1>ANIMAL - MERGE</h1>
    <div class="animal-grid">
      <div class="animal-card" onclick="showAnimal('tocón')">
        <img src="https://i.postimg.cc/Y9g9yN0f/image.png" alt="Mono Tocón">
        <p>Mono Tocón</p>
      </div>
      <div class="animal-card" onclick="showAnimal('ronsoco')">
        <img src="https://i.postimg.cc/rpg7Wj4Z/image.png" alt="Ronsoco">
        <p>Ronsoco</p>
      </div>
      <div class="animal-card" onclick="showAnimal('pescador')">
        <img src="https://i.postimg.cc/6pZvybkw/image.png" alt="Martín Pescador">
        <p>Martín Pescador</p>
      </div>
      <div class="animal-card" onclick="showAnimal('ardilla')">
        <img src="https://i.postimg.cc/DykWRPWM/image.png" alt="Mono Ardilla">
        <p>Mono Ardilla</p>
      </div>
    </div>
  </div>

  <!-- Pantalla de descripción -->
  <div id="animalDetail" class="hidden">
    <button id="backBtn" onclick="goBack()">⬅ Volver</button>
    <div id="animalContent"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
