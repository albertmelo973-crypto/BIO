<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ADECARAM - TINGANA</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Carátula -->
  <section id="caratula">
    <div class="overlay">
      <img src="https://i.postimg.cc/3wwJyYJP/Story-instagram-dia-da-natureza-ousado-preto-1.png" alt="Carátula">
      <p class="tap-text">TOCA PARA EMPEZAR</p>
    </div>
  </section>

  <!-- Menú principal -->
  <main id="main" class="hidden">
    <h1>ANIMAL - MERGE</h1>
    <div class="animal-grid">
      <div class="animal-card" onclick="showAnimal('tocón')">
        <img src="https://i.postimg.cc/Y9g9yN0f/image.png" alt="Mono Tocón">
        <p>Mono Tocón</p>
      </div>
      <div class="animal-card" onclick="showAnimal('ronsoco')">
        <img src="https://i.postimg.cc/rpg7Wj4Z/image.png" alt="Ronsoco">
        <p>Ronsoco</p>
      </div>
      <div class="animal-card" onclick="showAnimal('pescador')">
        <img src="https://i.postimg.cc/6pZvybkw/image.png" alt="Martín Pescador">
        <p>Martín Pescador</p>
      </div>
      <div class="animal-card" onclick="showAnimal('ardilla')">
        <img src="https://i.postimg.cc/DykWRPWM/image.png" alt="Mono Ardilla">
        <p>Mono Ardilla</p>
      </div>
    </div>
  </main>

  <!-- Detalle del animal -->
  <section id="animalDetail" class="hidden">
    <button id="backBtn" onclick="goBack()">Volver</button>
    <div id="animalContent"></div>
  </section>

  <script src="script.js"></script>
</body>
</html>
